# ==========================================================
# POSTGRES PROFILE: RENDER MANAGED POSTGRESQL CLOUD DATABASE
# ==========================================================

# Default fallback values if DATABASE_URL is not set (e.g. local PostgreSQL testing)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/techronics_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Hibernate JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Flyway: Disabled in cloud postgres so Hibernate auto-manages the schema cleanly
spring.flyway.enabled=false

# HikariCP Connection Pool settings for Render cloud container
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
