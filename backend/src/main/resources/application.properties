# ==========================================================
# TECHRONICS CYBER TIC-TAC-TOE BACKEND CONFIGURATION
# ==========================================================
# Dynamic server port for Render and cloud containers
server.port=${PORT:8080}

# ----------------------------------------------------------
# ACTIVE PROFILE SELECTION
# ----------------------------------------------------------
# Options:
#   - dev      : In-memory H2 database (MSSQLServer mode) + auto-seeding. Zero-setup, instant start.
#   - mssql    : Connects to local Microsoft SQL Server Express (localhost\SQLEXPRESS) with Flyway migrations.
#   - postgres : Managed PostgreSQL database for Render cloud production.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ----------------------------------------------------------
# SECURITY & JWT CONFIGURATION
# ----------------------------------------------------------
app.jwt.secret=${JWT_SECRET:4c7f8a9e2d3c4b5a6f7e8d9c0b1a2f3e4d5c6b7a8f9e0d1c2b3a9a3f9e28f28b}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ----------------------------------------------------------
# LOGGING
# ----------------------------------------------------------
logging.level.com.yourorg.appname=INFO
logging.level.org.springframework.security=INFO
