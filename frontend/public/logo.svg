<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Cyber Hexagon Outer Border -->
  <polygon points="60,8 108,34 108,86 60,112 12,86 12,34" fill="#0d0e17" stroke="url(#neonGlow)" stroke-width="2.5" filter="url(#glow)"/>
  <!-- Subtle Tic Tac Toe Grid Lines in BG -->
  <line x1="44" y1="36" x2="44" y2="84" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="76" y1="36" x2="76" y2="84" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="36" y1="52" x2="84" y2="52" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="36" y1="68" x2="84" y2="68" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="2 2"/>
  <!-- Central Tech T + Cyber Symbol -->
  <path d="M 38 40 L 82 40 L 76 50 L 65 50 L 65 82 L 55 82 L 55 50 L 38 50 Z" fill="url(#neonGlow)" filter="url(#glow)"/>
  <!-- Futuristic X and O Micro Accents -->
  <path d="M 28 32 L 34 38 M 34 32 L 28 38" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"/>
  <circle cx="92" cy="88" r="4" fill="none" stroke="#a855f7" stroke-width="2"/>
</svg>