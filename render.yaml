# =================================================================
# Render Infrastructure Blueprint (render.yaml)
# Techronics Cyber Tic-Tac-Toe Full-Stack Application
# =================================================================

databases:
  # ---------------------------------------------------------------
  # 1. Managed PostgreSQL Database
  # ---------------------------------------------------------------
  - name: techronics-db
    databaseName: techronics_db
    user: techronics_user
    plan: free
    region: oregon

services:
  # ---------------------------------------------------------------
  # 2. Backend Web Service (Spring Boot 3 + Java 17 Container)
  # ---------------------------------------------------------------
  - type: web
    name: techronics-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/quests/public
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: techronics-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://techronics-frontend.onrender.com

  # ---------------------------------------------------------------
  # 3. Frontend Static Site (React 18 + Vite SPA)
  # ---------------------------------------------------------------
  - type: web
    name: techronics-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # SPA Single Page Application rewrite rule to handle client-side routing
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: techronics-backend
          property: host
